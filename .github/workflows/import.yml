name: Import source repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'Jhn2059/kataleya'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import files from source
        env:
          SOURCE_URL: https://github.com/Jhn2059/SISTEMA-DESKTOP_AGENCIA-KATALEYA-VIP.git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add source "$SOURCE_URL"
          git fetch --no-tags source main
          git checkout source/main -- .
          git rm -f --ignore-unmatch ".github/workflows/compilar-windows.yml"
          if git diff --cached --quiet; then
            echo "Nothing to import"
            exit 0
          fi
          git commit -m "Import SISTEMA-DESKTOP_AGENCIA-KATALEYA-VIP"
          git push origin main
